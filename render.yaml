# Render Blueprint — free preview hosting for MOZES LIFE.
# The database is external (Neon, free tier); paste its connection string as DATABASE_URL.
services:
  - type: web
    name: mozes-life
    runtime: node
    plan: free
    region: ohio # same AWS region as the Neon database (US East 2)
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mozes/web build
    startCommand: pnpm --filter @mozes/web start:hosted
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste the Neon connection string
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_DEMO_COURSE
        value: "true"
      # Media storage (Cloudflare R2) — see DEPLOY.md, "אחסון קבצים"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
