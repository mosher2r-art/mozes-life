name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mozes
          POSTGRES_PASSWORD: mozes
          POSTGRES_DB: mozes_life_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mozes" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mozes:mozes@localhost:5432/mozes_life_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm --filter @mozes/web build
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000
          # Build-time CSP must allow the test package origin (see playwright.config.ts)
          PACKAGE_ORIGIN: http://127.0.0.1:3100
      - run: pnpm --filter @mozes/web exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - name: Generate and verify standalone SQL
        run: |
          pnpm --filter @mozes/web sql:generate
          git diff --exit-code -- supabase/fresh-install.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mozes_schema_test'
          pnpm --filter @mozes/web sql:verify
        env:
          SQL_TEST_DATABASE_URL: postgres://mozes:mozes@localhost:5432/mozes_schema_test
      - name: Build Worker and validate upload bundle without deployment
        run: |
          pnpm --filter @mozes/web build:worker
          pnpm --filter @mozes/web exec wrangler deploy --dry-run --outdir .worker-dry-run
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000
          PACKAGE_ORIGIN: http://127.0.0.1:3100
          WRANGLER_SEND_METRICS: "false"
      - name: Package the validated Worker build
        run: |
          python3 - <<'PYZIP'
          from pathlib import Path
          import zipfile
          output = Path('release')
          output.mkdir(exist_ok=True)
          with zipfile.ZipFile(output / 'mozes-life-worker.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for directory in ['.open-next', '.worker-dry-run']:
                  for path in Path('apps/web', directory).rglob('*'):
                      if path.is_file():
                          z.write(path, str(path.relative_to('apps/web')))
              z.write('apps/web/wrangler.jsonc', 'wrangler.jsonc')
              z.write('supabase/fresh-install.sql', 'SUPABASE_DATABASE.sql')
              z.write('INSTALL_HE.md', 'INSTALL_HE.md')
          PYZIP
      - uses: actions/upload-artifact@v7
        with:
          name: mozes-life-worker-${{ github.sha }}
          path: release/mozes-life-worker.zip
          retention-days: 3
          if-no-files-found: error
