name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mozes
          POSTGRES_PASSWORD: mozes
          POSTGRES_DB: mozes_life_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mozes" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mozes:mozes@localhost:5432/mozes_life_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm --filter @mozes/web build
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-0123456789abcdef
          BETTER_AUTH_URL: http://localhost:3000
          # Build-time CSP must allow the test package origin (see playwright.config.ts)
          PACKAGE_ORIGIN: http://127.0.0.1:3100
      - run: pnpm --filter @mozes/web exec playwright install --with-deps chromium
      - run: pnpm e2e
